resolver 127.0.0.11:53;

server {
    listen 80;
    server_name localhost;

    # Serve static HTML
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxy API calls to backend services
    location /auth/ {
        set $auth_service "http://auth-service:3001";
        proxy_pass $auth_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /products {
        set $catalog_service "http://catalog-service:3002";
        proxy_pass $catalog_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /cart/ {
        set $cart_service "http://cart-service:3003";
        proxy_pass $cart_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /orders {
        set $order_service "http://order-service:3004";
        proxy_pass $order_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

